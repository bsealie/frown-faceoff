<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anniversary challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161f;--card:#1e2130;--line:#2e3247;--text:#eef0f7;--mute:#9096b0;--accent:#ffb347;--bad:#ff6b6b;--good:#6ee7a0}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:radial-gradient(1200px 600px at 50% -200px,#3b2540,var(--bg));color:var(--text);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;padding:24px 16px 60px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.9rem,6vw,2.8rem);text-align:center;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{text-align:center;color:var(--mute);margin:6px 0 20px;min-height:1.3em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.stage{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#0d0f16;margin-bottom:14px}
.stage video,.stage img.snapimg{width:100%;height:100%;object-fit:cover;display:block}
.stage video{transform:scaleX(-1)}
.ring{position:absolute;inset:12% 22%;border:3px dashed rgba(255,255,255,.3);border-radius:50%;pointer-events:none}
.flash{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35)}
.flash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stamp{position:relative;font-family:'Fraunces',serif;font-weight:900;font-size:3rem;letter-spacing:.08em;padding:4px 18px;border:6px solid;border-radius:10px;transform:rotate(-12deg);background:rgba(0,0,0,.45)}
.stamp.bad{color:var(--bad);border-color:var(--bad)}
.stamp.good{color:var(--good);border-color:var(--good)}
.meter{height:10px;border-radius:99px;background:#12141d;position:relative;margin:2px 0 6px;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px;width:0;transition:width .15s}
.meter i.pass{background:var(--good)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.8}
.mlabel{display:flex;justify-content:space-between;color:var(--mute);font-size:.78rem;margin-bottom:10px}
button.go,label.go{display:block;width:100%;background:var(--accent);color:#1a1a1a;border:none;border-radius:12px;padding:13px;font:700 1rem 'DM Sans';cursor:pointer;margin-top:8px;text-align:center}
button.alt{background:none;border:1px solid var(--line);color:var(--mute);border-radius:12px;padding:11px;font:500 .95rem 'DM Sans';cursor:pointer;width:100%;margin-top:8px}
button:disabled{opacity:.4;cursor:not-allowed}
.note{color:var(--mute);font-size:.85rem;margin-top:10px;line-height:1.45}
.err{color:var(--bad)}
.prog{text-align:center;font-family:'Fraunces',serif;font-size:1.3rem;margin-bottom:12px}
.prog b{color:var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.thumbs div{aspect-ratio:1;border-radius:10px;background:#12141d;border:1px dashed var(--line);overflow:hidden}
.thumbs div.on{border:2px solid var(--good)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#next{position:fixed;left:40%;top:40%;z-index:5;background:var(--accent);color:#1a1a1a;border:none;border-radius:99px;font:700 18px 'DM Sans';padding:12px 22px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
#next.blink{animation:blink var(--blink,1s) infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.06}}
.hud{position:fixed;top:0;left:0;right:0;padding:14px 16px;text-align:center;background:linear-gradient(#14161f,rgba(20,22,31,0));pointer-events:none;z-index:4}
.hud .n{font-family:'Fraunces',serif;font-weight:900;font-size:2rem}
.hud .n span{color:var(--accent)}
.hud .t{color:var(--mute);font-size:.9rem;min-height:1.3em}
.ann{background:linear-gradient(160deg,#3b2540,#2a2f4d);border:1px solid #7a4d8f;border-radius:20px;padding:22px}
.annh{font-family:'Fraunces',serif;font-weight:900;font-size:1.5rem;margin-bottom:12px;text-align:center}
.annt{white-space:pre-wrap;line-height:1.65}
.rain{position:fixed;top:-40px;font-size:1.6rem;pointer-events:none;animation:fall linear forwards;z-index:3}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>Anniversary <span>challenge</span></h1>
  <p class="sub" id="sub"></p>

  <section id="lock" hidden>
    <div class="panel"><div style="font-size:3rem">🔒</div>
      <p style="margin:6px 0"><b>Not open yet</b></p>
      <p class="note">This opens at <b>12:00am SGT, 7 November</b>.</p>
      <p style="font-family:'Fraunces',serif;font-size:2rem;margin-top:10px" id="cd"></p></div>
  </section>

  <section id="s1" hidden>
    <div class="prog"><b id="cnt">0</b> / 10 frowns</div>
    <div class="panel">
      <div class="stage" id="stage"><div id="stageph" style="position:absolute;inset:0;display:grid;place-items:center;font-size:4rem">📸</div></div>
      <div id="meterwrap" hidden>
        <div class="meter"><i id="mbar"></i><b id="mmark"></b></div>
        <div class="mlabel"><span>Neutral</span><span id="mtxt">Frown meter</span><span>Big frown</span></div>
      </div>
      <button class="go" id="startcam">Start camera</button>
      <button class="go" id="snap" hidden>Snap this frown</button>
      <div id="fallback" hidden>
        <label class="go" for="file">Take / choose a frown photo</label>
        <input type="file" id="file" accept="image/*" capture="user" hidden>
      </div>
      <div id="confirm" hidden>
        <button class="go" id="keep">Count this one</button>
        <button class="alt" id="toss">Retake</button>
      </div>
      <p class="note" id="msg">Take 10 good frowns. Smiles, blank faces and no-face shots get voided.</p>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <button class="go" id="toS2" hidden>Frowns done. Next challenge →</button>
  </section>

  <section id="done" hidden>
    <div class="ann">
      <div class="annh">💌 Happy 1 year anniversary!</div>
      <div class="annt" id="annt"></div>
    </div>
    <div class="thumbs" id="collage" style="margin-top:18px"></div>
    <p class="note" style="text-align:center" id="collnote"></p>
  </section>
</div>

<div class="hud" id="hud" hidden><div class="n"><span id="clk">0</span> / 100</div><div class="t" id="taunt">Click Next 100 times</div></div>
<button id="next" hidden>Next</button>

<script type="module">
const AT=Date.UTC(2026,10,6,16,0,0); /* 12:00am SGT, 7 Nov 2026 */
const NEED=10, FROWN_MIN=0.25, SMILE_MAX=0.15;
const MSG_B64="SGFwcHkgYW5uaXZlcnNhcnkhISBDYW4geW91IGJlbGlldmUgdGhhdCBpdOKAmXMgb25lIHllYXIgaW50byBvdXIgcmVsYXRpb25zaGlwPyEgSWYgSSBkaWRu4oCZdCBhc2sgeW91IG91dCBmb3IgdGhlIEVhc3QgQ29hc3QgUGFyayBkYXRlLCBJ4oCZZCBwcm9iYWJseSBzdGlsbCBiZSBzaW5nbGUgYnkgbm93IGFuZCBkZXN0aW5lZCB0byBiZSBzaW5nbGUgZm9yIHRoZSByZXN0IG9mIG15IGxpZmUgc2luY2UgbXkgaW1tYWN1bGF0ZSByaXp6IG9ubHkgd29ya3Mgb24geW91IGhlaGUuCgpMaWZlIGluIEFtZXJpY2EgaXMgZnVuISBJIGZlZWwgbGlrZSBJ4oCZbSBhZGFwdGluZyB0byBsaXZpbmcgaGVyZSwgYmUgaXQgbWVhbCBwcmVwcGluZyBvciB0aGUgbG9uZyBkaXN0YW5jZSB3YWxrcy4gQnV0IGFsbCB0aGVzZSBleHBlcmllbmNlcyB3b3VsZCBiZSBiZXR0ZXIgaWYgeW91IHdlcmUgaGVyZSA6KAoKSSB3aXNoIGZvciBhIGZ1dHVyZSB3aGVyZSB3ZSB0cmF2ZWwgd2l0aCBhIGNhciBleHBsb3JpbmcgbmV3IGNpdGllcyBhbmQgbmF0dXJlLiBUaGF04oCZcyB0b25zIG9mIHBsYWNlcyB0byBiZSBmcmVha3kgaGVoZWggam9rZXMuCgpEb27igJl0IG1pc3MgbWUgc28gbXVjaCwgU2luZ2Fwb3JlISBEb27igJl0IHlvdSBkYXJlIGRyZWFtIG9mIG1lIGR5aW5nIDooIEnigJlsbCBiZSBiYWNrIHNhZmVseSBoZWhlaCBhbmQgd2Ugd2lsbCBmaW5hbGx5IHNwZW5kIHRpbWUgdG9nZXRoZXIgYWdhaW4gaGVoZWgh";
const MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const TASKS='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const TEST=params.has('test');
if(params.has('reset')){try{localStorage.removeItem('anv')}catch(e){}}
let st={stage:1,clicks:0};
try{const s=JSON.parse(localStorage.getItem('anv')||'null');if(s&&typeof s==='object')st={stage:s.stage|0||1,clicks:s.clicks|0}}catch(e){}
const save=()=>{try{localStorage.setItem('anv',JSON.stringify(st))}catch(e){}};
const decode=()=>new TextDecoder().decode(Uint8Array.from(atob(MSG_B64),c=>c.charCodeAt(0)));

const views=['lock','s1','done'];
function show(name){
  views.forEach(v=>$(v).hidden=v!==name);
  $('wrap').hidden=(name==='s2');
  $('hud').hidden=$('next').hidden=(name!=='s2');
}
const mmss=ms=>{ms=Math.max(0,ms);const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return (d?d+'d ':'')+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};

/* ---------- routing ---------- */
let lockTimer=null;
function route(){
  if(!TEST&&Date.now()<AT){
    show('lock');$('sub').textContent='Something is waiting for you…';
    const tick=()=>{const left=AT-Date.now();if(left<=0){clearInterval(lockTimer);route();return}$('cd').textContent=mmss(left)};
    tick();clearInterval(lockTimer);lockTimer=setInterval(tick,1000);return;
  }
  if(st.stage>=3){finish(false);return}
  if(st.stage===2){startS2();return}
  $('sub').textContent='Stage 1: show me your best frowns';
  show('s1');loadModel();
}

/* ---------- stage 1: frown detection ---------- */
let landmarker=null,modelState='idle',stream=null,live=null,candidate=null;
const photos=[];
async function loadModel(){
  if(modelState!=='idle')return;modelState='loading';
  $('msg').textContent='Loading the frown checker…';
  try{
    const {FaceLandmarker,FilesetResolver}=await import(TASKS+'/vision_bundle.mjs');
    const fs=await FilesetResolver.forVisionTasks(TASKS+'/wasm');
    const opts=d=>({baseOptions:{modelAssetPath:MODEL,delegate:d},outputFaceBlendshapes:true,runningMode:'IMAGE',numFaces:2});
    try{landmarker=await FaceLandmarker.createFromOptions(fs,opts('GPU'))}
    catch(e){landmarker=await FaceLandmarker.createFromOptions(fs,opts('CPU'))}
    modelState='ready';$('msg').textContent='Take 10 good frowns. Smiles, blank faces and no-face shots get voided.';
  }catch(e){
    modelState='failed';
    $('msg').textContent='The automatic frown checker couldn’t load, so you’ll confirm each photo yourself. Keep it honest.';
  }
}
function judge(src){
  if(!landmarker)return {ok:null};
  const r=landmarker.detect(src);
  const n=(r.faceLandmarks||[]).length;
  if(n===0)return {ok:false,frown:0,why:'No face found. Get your face in the frame.'};
  if(n>1)return {ok:false,frown:0,why:'More than one face in the shot.'};
  const m={};((r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories)||[]).forEach(c=>m[c.categoryName]=c.score);
  const frown=((m.mouthFrownLeft||0)+(m.mouthFrownRight||0))/2;
  const smile=((m.mouthSmileLeft||0)+(m.mouthSmileRight||0))/2;
  if(smile>SMILE_MAX)return {ok:false,frown,why:'That’s a smile. Not allowed.'};
  if(frown<FROWN_MIN)return {ok:false,frown,why:'Not frowny enough. Pull those mouth corners down!'};
  return {ok:true,frown};
}
const MAXV=0.6;
$('mmark').style.left=(FROWN_MIN/MAXV*100)+'%';

async function startCam(){
  $('startcam').hidden=true;$('msg').textContent='Starting camera… allow access if asked.';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no api');
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:720},height:{ideal:720}},audio:false});
    const v=document.createElement('video');v.playsInline=true;v.muted=true;v.srcObject=stream;
    $('stage').innerHTML='';$('stage').append(v);
    const ring=document.createElement('div');ring.className='ring';$('stage').append(ring);
    await v.play();live=v;
    $('snap').hidden=false;$('meterwrap').hidden=false;
    $('msg').textContent=modelState==='failed'?'Frown, then snap. You’ll confirm each one.':'Frown at the camera, watch the meter, then snap.';
    liveLoop();
  }catch(e){
    $('stage').innerHTML='<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:4rem">📸</div>';
    $('fallback').hidden=false;
    $('msg').textContent='Couldn’t start the webcam. Check the camera permission for this site, or pick a photo instead.';
  }
}
let busy=false;
function liveLoop(){
  const tick=()=>{
    if(!live)return;
    if(!busy&&landmarker&&live.videoWidth){
      try{
        const r=judge(live),f=r.frown||0;
        $('mbar').style.width=Math.min(100,f/MAXV*100)+'%';
        $('mbar').classList.toggle('pass',!!r.ok);
        $('mtxt').textContent=r.ok?'Good frown!':(r.why&&r.why.startsWith('No face')?'No face':'Frown meter');
      }catch(e){}
    }
    setTimeout(tick,260);
  };tick();
}
function squareFrom(src,w,h,mirror){
  const s=360,c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d'),m=Math.min(w,h);
  if(mirror){x.translate(s,0);x.scale(-1,1)}
  x.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,s,s);
  return c;
}
function flash(dataUrl,kind,text){
  const el=document.createElement('div');el.className='flash';
  el.innerHTML='<img alt=""><div class="stamp '+kind+'">'+text+'</div>';
  el.querySelector('img').src=dataUrl;$('stage').append(el);
  setTimeout(()=>el.remove(),1300);
}
function accept(url){
  photos.push(url);
  const t=$('thumbs');
  const slot=t.children[photos.length-1];slot.className='on';slot.innerHTML='<img alt="">';slot.firstChild.src=url;
  $('cnt').textContent=photos.length;
  if(photos.length>=NEED){
    $('msg').textContent='That’s 10! You’re a frowning champion.';
    $('snap').hidden=true;$('fallback').hidden=true;$('meterwrap').hidden=true;
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;live=null}
    $('toS2').hidden=false;
  }
}
function evaluate(canvas){
  busy=true;
  const url=canvas.toDataURL('image/jpeg',.75);
  let r;try{r=judge(canvas)}catch(e){r={ok:null}}
  busy=false;
  if(r.ok===true){flash(url,'good','FROWN ✓');accept(url);$('msg').textContent='Nice one. '+(NEED-photos.length)+' to go.'}
  else if(r.ok===false){flash(url,'bad','VOID');$('msg').textContent=r.why;$('msg').className='note err';$('stage').classList.remove('shake');void $('stage').offsetWidth;$('stage').classList.add('shake');setTimeout(()=>{$('msg').className='note'},2500)}
  else{candidate=url;$('stage').insertAdjacentHTML('beforeend','<div class="flash" id="cf"><img alt=""></div>');$('cf').firstChild.src=url;$('confirm').hidden=false;$('snap').hidden=true;$('fallback').hidden=true}
}
$('startcam').onclick=startCam;
$('snap').onclick=()=>{if(!live||!live.videoWidth)return;evaluate(squareFrom(live,live.videoWidth,live.videoHeight,true))};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>evaluate(squareFrom(im,im.width,im.height,false));im.src=r.result};
  r.readAsDataURL(f);e.target.value='';
};
$('keep').onclick=()=>{const u=candidate;candidate=null;$('cf')&&$('cf').remove();$('confirm').hidden=true;if(live)$('snap').hidden=false;else $('fallback').hidden=false;if(u)accept(u)};
$('toss').onclick=()=>{candidate=null;$('cf')&&$('cf').remove();$('confirm').hidden=true;if(live)$('snap').hidden=false;else $('fallback').hidden=false};
for(let i=0;i<NEED;i++)$('thumbs').append(document.createElement('div'));
$('toS2').onclick=()=>{st.stage=2;st.clicks=0;save();startS2()};

/* ---------- stage 2: the moving Next button ---------- */
let gTimer=null,s2On=false;
const TAUNTS={1:'Click Next 100 times. Easy, right?',20:'Getting faster…',40:'Almost halfway. Almost.',50:'Halfway! It’s shrinking now…',65:'Blinking and tiny. Keep going.',80:'You can do it.',90:'So close!',97:'Three more!'};
function startS2(){
  $('sub').textContent='';show('s2');s2On=true;
  updHud();glide();
}
function updHud(){
  $('clk').textContent=st.clicks;
  let t=null;Object.keys(TAUNTS).forEach(k=>{if(st.clicks>=+k)t=TAUNTS[k]});
  $('taunt').textContent=t||TAUNTS[1];
}
const rnd=(a,b)=>a+Math.random()*Math.max(0,b-a);
function glide(){
  if(!s2On)return;
  const btn=$('next'),c=st.clicks;
  const f=c>=50?1-((c-50)/50)*0.5:1;
  btn.style.fontSize=(18*f)+'px';btn.style.padding=(12*f)+'px '+(22*f)+'px';
  btn.classList.toggle('blink',c>=50);
  btn.style.setProperty('--blink',(1.1-Math.max(0,(c-50)/50)*0.8).toFixed(2)+'s');
  const dur=Math.round(1700-(1700-230)*Math.min(1,c/100));
  const w=btn.offsetWidth,h=btn.offsetHeight;
  const x=rnd(6,innerWidth-w-6),y=rnd(80,innerHeight-h-6);
  btn.style.transition='left '+dur+'ms linear, top '+dur+'ms linear';
  btn.style.left=x+'px';btn.style.top=y+'px';
  clearTimeout(gTimer);gTimer=setTimeout(glide,dur);
}
$('next').onclick=()=>{
  if(!s2On)return;
  st.clicks++;save();updHud();
  if(st.clicks>=100){s2On=false;clearTimeout(gTimer);finish(true);return}
  glide();
};
addEventListener('resize',()=>{if(s2On)glide()});

/* ---------- reveal ---------- */
function finish(first){
  st.stage=3;save();show('done');$('sub').textContent='You did it.';
  $('annt').textContent=decode();
  const col=$('collage');col.innerHTML='';
  if(photos.length){
    photos.forEach(u=>{const d=document.createElement('div');d.className='on';const i=document.createElement('img');i.alt='';i.src=u;d.append(i);col.append(d)});
    $('collnote').textContent='Your 10 frowns. These never left your device.';
  }
  if(first)rain();
}
function rain(){
  const em=['💖','💌','🙁','💕'];
  for(let i=0;i<28;i++){
    const e=document.createElement('div');e.className='rain';e.textContent=em[i%em.length];
    e.style.left=Math.random()*100+'vw';e.style.animationDuration=(3+Math.random()*3)+'s';e.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.append(e);setTimeout(()=>e.remove(),8000);
  }
}
route();
</script>
</body>
</html>
